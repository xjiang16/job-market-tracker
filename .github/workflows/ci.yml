name: CI

# Runs on every PR (and pushes to main) so bugs are caught before merge instead
# of by the next daily refresh run. Uses no real credentials: pytest mocks all
# external calls, and the dbt integration test (tests/test_demo.py) runs the
# real models against local DuckDB fixture data instead of Snowflake.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v
